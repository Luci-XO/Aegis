# One-click deploy of the Aegis dashboard to Render (free plan).
# Docs: https://render.com/docs/blueprint-spec
#
# No real-AI key is configured on purpose: the dashboard has no login, so a
# key here would let any visitor spend your model quota via "Launch attack".
services:
  - type: web
    name: aegis
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip
    startCommand: python -m aegis.web --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AEGIS_APPROVAL_SECRET
        generateValue: true
