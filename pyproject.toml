[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.2.0"
description = "Deterministic policy enforcement for AI-agent tool calls"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ayan (Luci-XO)" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "llm-security", "prompt-injection", "policy-enforcement", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The security core intentionally has no third-party runtime dependencies.
dependencies = []

[project.urls]
Repository = "https://github.com/Luci-XO/Aegis"
Security = "https://github.com/Luci-XO/Aegis/blob/main/SECURITY.md"

[project.scripts]
aegis-dashboard = "aegis.web.__main__:main"
aegis-benchmark = "aegis.eval.benchmark:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["data/*.json", "data/synthetic/*.json", "data/scenarios/*.json", "policies/*.json", "eval/freeze.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["E501", "RUF005", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use homoglyphs (RUF001) and a seeded, non-crypto RNG (S311).
"tests/**" = ["S101", "S105", "S106", "S311", "B008", "B905", "RUF001", "RUF005", "RUF059"]
"scripts/**" = ["S101", "S603", "PLW1510", "ISC004", "B905"]

[tool.mypy]
python_version = "3.10"
strict_optional = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "numpy", "numpy.*"]
ignore_missing_imports = true
