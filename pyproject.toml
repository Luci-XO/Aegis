[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Deterministic policy enforcement for AI-agent tool calls"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The security core intentionally has no third-party runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["data/synthetic/*.json", "data/scenarios/*.json", "policies/*.json", "eval/freeze.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["E501", "RUF005", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use homoglyphs (RUF001) and a seeded, non-crypto RNG (S311).
"tests/**" = ["S101", "S105", "S106", "S311", "B008", "B905", "RUF001", "RUF005", "RUF059"]
"scripts/**" = ["S603", "PLW1510", "ISC004", "B905"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
